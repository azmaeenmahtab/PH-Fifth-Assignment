<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-50 min-h-screen">
    <header class="w-full bg-white border-b border-blue-200 py-3  flex items-center justify-between">
        <div class="max-w-[1400px] mx-auto flex items-center justify-between w-full">
            <div class="flex items-center gap-2">
                <img src="assets/github-logo.png" alt="GitHub Logo" class="w-8 h-8" />
                <span class="font-bold text-xl">GitHub Issues Tracker</span>
            </div>
            <div class="flex items-center gap-4">
                <input type="text" placeholder="Search issues..." class="input input-bordered w-64" />
                <button class="btn btn-primary">+ New Issue</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto mt-8">
        <!-- Filter Tabs -->
        <div class="bg-white rounded-xl shadow p-4 mb-6 border border-blue-200">
            <div class="flex gap-2">
                <button class="btn btn-sm btn-outline" id="allbtn">All</button>
                <button class="btn btn-sm btn-outline" id="openbtn">Open</button>
                <button class="btn btn-sm btn-outline" id="closedbtn">Closed</button>
            </div>
        </div>

        <div class="bg-white rounded-t-xl flex items-center  justify-between p-4 border  border-blue-200">
            <div class="flex items-center gap-3">
                <div class="p-2 rounded-full bg-purple-200">
                    <img src="assets/Aperture.png" alt="">
                </div>
                <div class="flex flex-col items-start">
                    <span class="text-lg font-semibold"><span id="total-issue-number"></span> Issues</span>
                    <span class="text-gray-500">Track and manage your project issues</span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span class="flex items-center gap-1 text-green-500"><span
                        class="w-3 h-3 rounded-full bg-green-400 inline-block"></span>Open</span>
                <span class="flex items-center gap-1 text-purple-500"><span
                        class="w-3 h-3 rounded-full bg-purple-400 inline-block"></span>Closed</span>
            </div>
        </div>


        <div id="cards-section"
            class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 p-4 mb-6 border-b border-blue-200 rounded-b-xl shadow">

        </div>
    </main>


    <!-- Issue Detail Modal -->
    <dialog id="issue-modal" class="modal">
        <div class="modal-box w-11/12 max-w-lg rounded-2xl p-6">
            <!-- Title -->
            <h3 id="modal-title" class="font-bold text-lg mb-3"></h3>
            <!-- Status row -->
            <div class="flex items-center gap-2 mb-3 text-sm text-gray-500">
                <span id="modal-status-badge"
                    class="badge badge-lg font-semibold px-3 py-1 rounded-full text-xs"></span>
                <span>•</span>
                <span>Opened by <span id="modal-author" class="text-gray-700 "></span></span>
                <span>•</span>
                <span id="modal-created"></span>
            </div>
            <!-- Labels -->
            <div id="modal-labels" class="flex flex-wrap gap-2 mb-4"></div>
            <!-- Description -->
            <p id="modal-description" class="text-gray-600 text-sm mb-5"></p>
            <!-- Assignee / Priority box -->
            <div class="bg-gray-100 rounded-xl p-4 flex items-center justify-between mb-5">
                <div>
                    <p class="text-xs text-gray-500 mb-1">Assignee:</p>
                    <p id="modal-assignee" class="font-bold text-gray-800"></p>
                </div>
                <div class="text-right">
                    <p class="text-xs text-gray-500 mb-1">Priority:</p>
                    <span id="modal-priority"
                        class="badge badge-lg font-semibold px-3 py-1 rounded-full text-xs"></span>
                </div>
            </div>
            <!-- Close button -->
            <div class="flex justify-end">
                <form method="dialog">
                    <button class="btn btn-primary px-6">Close</button>
                </form>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <script src="scripts/dashboard.js"></script>
    <script src="scripts/modal.js"></script>
</body>

</html>
