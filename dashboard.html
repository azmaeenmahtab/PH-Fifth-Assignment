<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-50 min-h-screen">
    <header class="w-full bg-white border-b border-blue-200 py-3  flex items-center justify-between">
        <div class="max-w-[1400px] mx-auto flex items-center justify-between w-full">
            <div class="flex items-center gap-2">
                <img src="assets/github-logo.png" alt="GitHub Logo" class="w-8 h-8" />
                <span class="font-bold text-xl">GitHub Issues Tracker</span>
            </div>
            <div class="flex items-center gap-4">
                <input type="text" placeholder="Search issues..." class="input input-bordered w-64" />
                <button class="btn btn-primary">+ New Issue</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto mt-8">
        <!-- Filter Tabs -->
        <div class="bg-white rounded-xl shadow p-4 mb-6 border border-blue-200">
            <div class="flex gap-2">
                <button class="btn btn-sm btn-primary">All</button>
                <button class="btn btn-sm btn-outline">Open</button>
                <button class="btn btn-sm btn-outline">Closed</button>
            </div>
        </div>

        <div class="bg-white rounded-t-xl flex items-center  justify-between p-4 border  border-blue-200">
            <div class="flex items-center gap-3">
                <div class="p-2 rounded-full bg-purple-200">
                    <img src="assets/Aperture.png" alt="">
                </div>
                <div class="flex flex-col items-start">
                    <span class="text-lg font-semibold">50 Issues</span>
                    <span class="text-gray-500">Track and manage your project issues</span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span class="flex items-center gap-1 text-green-500"><span
                        class="w-3 h-3 rounded-full bg-green-400 inline-block"></span>Open</span>
                <span class="flex items-center gap-1 text-purple-500"><span
                        class="w-3 h-3 rounded-full bg-purple-400 inline-block"></span>Closed</span>
            </div>
        </div>

        <!-- Cards Section (empty for now) -->
        <div id="cards-section"
            class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 p-4 mb-6 border-b border-blue-200 rounded-b-xl shadow">
            <!-- Cards will be rendered here dynamically -->
        </div>
    </main>


    <script src="scripts/dashboard.js"></script>
</body>

</html>
