<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div class="min-h-screen flex items-center justify-center bg-gray-100">
        <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md flex flex-col items-center">
            <img src="assets/github-logo.png" alt="GitHub Logo" class="w-20 h-20 mb-4" />
            <h2 class="text-2xl font-semibold mb-1">GitHub Issues Tracker</h2>
            <p class="text-gray-500 mb-6 text-center">Sign in to manage your issues</p>
            <form class="w-full" id="loginForm">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-1" for="username">Username</label>
                    <input id="username" type="text" placeholder="Enter Username" class="input input-bordered w-full"  />
                    <span class="text-xs text-purple-600 mt-1 block">Default: <span
                            class="underline">admin</span></span>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-1" for="password">Password</label>
                    <input id="password" type="password" placeholder="Enter Password"
                        class="input input-bordered w-full" />
                    <span class="text-xs text-purple-600 mt-1 block">Default: <span
                            class="underline">admin123</span></span>
                </div>
                <button type="submit" class="btn btn-primary w-full mb-4">Sign In</button>
            </form>
            <div class="w-full flex items-center my-2">
                <div class="flex-1 border-t border-gray-200"></div>
                <span class="mx-2 text-gray-400">OR</span>
                <div class="flex-1 border-t border-gray-200"></div>
            </div>
            <div class="bg-gray-50 rounded-lg p-4 w-full text-center mt-2">
                <span class="text-gray-500 text-sm">Demo Credentials:</span>
                <div class="mt-2">
                    <span class="font-semibold">Username:</span> <span class="text-gray-700">admin</span><br>
                    <span class="font-semibold">Password:</span> <span class="text-gray-700">admin123</span>
                </div>
            </div>
        </div>
    </div>
    <script src="scripts/login.js"></script>
</body>

</html>
